workflows:
  customer-android:
    name: 9jaRide Pro Customer Android
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.41.6
      java: 17
      groups:
        - jaride_secrets
      vars:
        APP_DIR: GoRide_V5.6_Source_Code/Applications/GoRide-5.6/customer
    scripts:
      - name: Decode keystore
        script: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$APP_DIR/android/app/keystore.jks"
      - name: Write key.properties
        script: |
          cat > "$APP_DIR/android/key.properties" <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=keystore.jks
          EOF
      - name: Decode google-services.json
        script: |
          echo "$GOOGLE_SERVICES_CUSTOMER_BASE64" | base64 -d > "$APP_DIR/android/app/google-services.json"
      - name: Flutter pub get
        script: |
          cd "$APP_DIR"
          flutter pub get
      - name: Build APK
        script: |
          cd "$APP_DIR"
          flutter build apk --release
      - name: Rename APK
        script: |
          mv "$APP_DIR/build/app/outputs/flutter-apk/app-release.apk" "$APP_DIR/build/app/outputs/flutter-apk/9jaRidePro-Customer.apk"
    artifacts:
      - $APP_DIR/build/app/outputs/flutter-apk/9jaRidePro-*.apk

  driver-android:
    name: 9jaRide Pro Driver Android
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.41.6
      java: 17
      groups:
        - jaride_secrets
      vars:
        APP_DIR: GoRide_V5.6_Source_Code/Applications/GoRide-5.6/driver
    scripts:
      - name: Decode keystore
        script: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$APP_DIR/android/app/keystore.jks"
      - name: Write key.properties
        script: |
          cat > "$APP_DIR/android/key.properties" <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=keystore.jks
          EOF
      - name: Decode google-services.json
        script: |
          echo "$GOOGLE_SERVICES_DRIVER_BASE64" | base64 -d > "$APP_DIR/android/app/google-services.json"
      - name: Flutter pub get
        script: |
          cd "$APP_DIR"
          flutter pub get
      - name: Build APK
        script: |
          cd "$APP_DIR"
          flutter build apk --release
      - name: Rename APK
        script: |
          mv "$APP_DIR/build/app/outputs/flutter-apk/app-release.apk" "$APP_DIR/build/app/outputs/flutter-apk/9jaRidePro-Driver.apk"
    artifacts:
      - $APP_DIR/build/app/outputs/flutter-apk/9jaRidePro-*.apk

  all-android:
    name: 9jaRide Pro Customer + Driver (both APKs)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      flutter: 3.41.6
      java: 17
      groups:
        - jaride_secrets
      vars:
        CUSTOMER_DIR: GoRide_V5.6_Source_Code/Applications/GoRide-5.6/customer
        DRIVER_DIR: GoRide_V5.6_Source_Code/Applications/GoRide-5.6/driver
    scripts:
      - name: Build Customer APK
        script: |
          set -e
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$CUSTOMER_DIR/android/app/keystore.jks"
          cat > "$CUSTOMER_DIR/android/key.properties" <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=keystore.jks
          EOF
          echo "$GOOGLE_SERVICES_CUSTOMER_BASE64" | base64 -d > "$CUSTOMER_DIR/android/app/google-services.json"
          cd "$CUSTOMER_DIR"
          flutter pub get
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/9jaRidePro-Customer.apk
      - name: Build Driver APK
        script: |
          set -e
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$DRIVER_DIR/android/app/keystore.jks"
          cat > "$DRIVER_DIR/android/key.properties" <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=keystore.jks
          EOF
          echo "$GOOGLE_SERVICES_DRIVER_BASE64" | base64 -d > "$DRIVER_DIR/android/app/google-services.json"
          cd "$DRIVER_DIR"
          flutter pub get
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/9jaRidePro-Driver.apk
    artifacts:
      - GoRide_V5.6_Source_Code/Applications/GoRide-5.6/customer/build/app/outputs/flutter-apk/9jaRidePro-*.apk
      - GoRide_V5.6_Source_Code/Applications/GoRide-5.6/driver/build/app/outputs/flutter-apk/9jaRidePro-*.apk
